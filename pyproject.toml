[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-wa-mcp-server"
version = "0.1.0"
description = "Read-only MCP server that scans an AWS account against the six AWS Well-Architected pillars."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mahendran Selvakumar", email = "skmahe1077@gmail.com" }]
keywords = ["aws", "well-architected", "mcp", "boto3", "security", "cost"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "mcp>=2.0",
    "boto3>=1.28",
]

[project.urls]
Homepage = "https://github.com/skmahe1077/aws-wa-mcp-server"
Repository = "https://github.com/skmahe1077/aws-wa-mcp-server"
Issues = "https://github.com/skmahe1077/aws-wa-mcp-server/issues"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "moto[ec2,s3,rds,iam,elb,elbv2,autoscaling,guardduty,cloudtrail,config,cloudwatch,logs,budgets]>=5.0",
]

[project.scripts]
aws-wa-mcp-server = "aws_wa_mcp.server:main"

[tool.setuptools.packages.find]
include = ["aws_wa_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
