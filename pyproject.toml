[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-wa-mcp-server"
version = "0.1.0"
description = "Read-only MCP server that scans an AWS account against the six AWS Well-Architected pillars."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "aws-wa-mcp-server" }]
keywords = ["aws", "well-architected", "mcp", "boto3", "security", "cost"]
dependencies = [
    "mcp>=2.0",
    "boto3>=1.28",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "moto[ec2,s3,rds,iam,elb,elbv2,autoscaling,guardduty,cloudtrail,config,cloudwatch,logs,budgets]>=5.0",
]

[project.scripts]
aws-wa-mcp-server = "aws_wa_mcp.server:main"

[tool.setuptools.packages.find]
include = ["aws_wa_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
